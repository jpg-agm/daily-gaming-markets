name: Daily markets table

on:
  schedule:
    # GitHub often starts scheduled jobs 1h+ late, so run well before the 14:00 UTC digest.
    - cron: "17 9 * * 1-5"
    # Backup run in case the first one is delayed or fails.
    - cron: "17 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  markets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build markets table
        run: python stock_table.py --write

      - name: Commit results
        run: |
          git config user.name "markets-bot"
          git config user.email "markets-bot@users.noreply.github.com"
          git add markets.md markets.json
          git diff --cached --quiet || git commit -m "Markets table $(date -u +%F)"
          git push
