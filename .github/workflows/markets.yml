name: Daily markets table

on:
  schedule:
    # 13:15 UTC Mon-Fri = 6:15 AM PDT / 5:15 AM PST, ahead of the 14:00 UTC digest.
    - cron: "15 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  markets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build markets table
        run: python stock_table.py --write

      - name: Commit results
        run: |
          git config user.name "markets-bot"
          git config user.email "markets-bot@users.noreply.github.com"
          git add markets.md markets.json
          git diff --cached --quiet || git commit -m "Markets table $(date -u +%F)"
          git push
